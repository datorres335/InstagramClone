packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  nx: true
  sharp: true
  unrs-resolver: true
  '@nestjs/core': false
  '@prisma/engines': true
  esbuild: true
  prisma: true
  argon2: true
  # scarf's postinstall is purely an anonymous-telemetry beacon (used by
  # some class-validator/class-transformer-adjacent tooling) — denied, not
  # needed for functionality.
  '@scarf/scarf': false
  # Native binary extension for msgpackr (bullmq/ioredis's serialization
  # layer) — same category as sharp/argon2 above, needed for functionality.
  msgpackr-extract: true
minimumReleaseAgeExclude:
  - '@aws-sdk/client-s3@3.1142.0'
  - '@aws-sdk/s3-request-presigner@3.1142.0'
# react-native@0.85.3's bundled renderer is version-locked to react@19.2.3
# (peerDependencies pins ^19.2.3, but newer 19.x minors still throw
# "Incompatible React versions" at runtime) — force every consumer in the
# workspace to resolve the exact same react/react-dom/react-test-renderer,
# overriding any individual package's looser semver range.
overrides:
  react: 19.2.3
  react-dom: 19.2.3
  react-test-renderer: 19.2.3
