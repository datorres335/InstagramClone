packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  nx: true
  sharp: true
  unrs-resolver: true
  '@nestjs/core': false
  '@prisma/engines': true
  esbuild: true
  prisma: true
  argon2: true
  # scarf's postinstall is purely an anonymous-telemetry beacon (used by
  # some class-validator/class-transformer-adjacent tooling) — denied, not
  # needed for functionality.
  '@scarf/scarf': false
